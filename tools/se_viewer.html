<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>効果音ビューア</title>
<style>
  :root { --bg:#0f1b2d; --panel:#17263a; --panel2:#1d2f47; --line:#2f4460; --ink:#f4f6fa; --muted:#98a3b8; --gold:#f4cd7c; --green:#7ee0a0; --red:#ff7a7a; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic","Hiragino Sans",sans-serif; font-size:14px; }
  .wrap { display:grid; grid-template-columns: 200px 1fr 360px; gap:14px; padding:14px; height:100vh; box-sizing:border-box; }
  h1 { font-size:18px; margin:0 0 4px; grid-column:1 / -1; }
  .sub { color:var(--muted); font-size:12px; grid-column:1 / -1; margin-top:-4px; line-height:1.6; }
  .list { background:var(--panel); border-radius:8px; padding:8px; align-self:start; }
  .list button { display:block; width:100%; text-align:left; font:inherit; background:transparent; color:var(--ink); border:0; border-radius:6px; padding:8px 10px; cursor:pointer; }
  .list button.sel { background:var(--panel2); color:var(--gold); font-weight:bold; }
  .list small { color:var(--muted); font-size:11px; margin-left:6px; }
  .main { background:var(--panel); border-radius:8px; padding:10px 12px; overflow-y:auto; min-height:0; }
  .scene { display:grid; grid-template-columns: 1fr; gap:10px; }
  .scene img { max-width:100%; border-radius:6px; border:1px solid var(--line); background:#000; }
  .ev { display:grid; grid-template-columns: 150px 1fr; gap:8px 12px; border-top:1px solid var(--line); padding:8px 0; align-items:center; }
  .ev.sel { background:var(--panel2); border-radius:6px; padding:8px; }
  .ev .name { font-weight:bold; color:var(--gold); cursor:pointer; }
  .ev .when { grid-column:1 / -1; color:var(--muted); font-size:12px; line-height:1.5; }
  .ev .cur { font-size:12px; color:var(--muted); }
  .ev .cur b { color:var(--ink); font-weight:normal; }
  .ev .cur .changed { color:var(--green); }
  .ctrl { background:var(--panel); border-radius:8px; padding:10px 12px; overflow-y:auto; min-height:0; }
  .ctrl h2 { font-size:14px; color:var(--gold); margin:4px 0 8px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; color:var(--muted); }
  .row label { flex:0 0 72px; }
  .row input[type=range] { flex:1; min-width:0; }
  .row input[type=number] { flex:0 0 66px; width:66px; font:inherit; font-size:12px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:2px 4px; text-align:right; }
  .cands { max-height:40vh; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin:6px 0; }
  .cands div { display:flex; align-items:center; gap:6px; padding:5px 8px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .cands div:hover { background:var(--panel2); }
  .cands div.sel { background:var(--panel2); color:var(--gold); }
  .cands div .tag { flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:999px; background:var(--bg); color:var(--muted); }
  .cands div .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cands div button { flex:0 0 auto; }
  button.primary { font:inherit; font-weight:bold; background:var(--gold); color:#3b2a12; border:0; border-radius:6px; padding:8px 16px; cursor:pointer; }
  button.plain { font:inherit; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.mini { font:inherit; font-size:11px; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; }
  pre { background:var(--bg); padding:8px; border-radius:6px; font-size:12px; white-space:pre-wrap; user-select:all; margin:8px 0 0; max-height:30vh; overflow:auto; }
  .note { color:var(--muted); font-size:12px; line-height:1.6; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>効果音ビューア</h1>
  <div class="sub">場面ごとに「いつ鳴るか」と絵を見ながら、今の音・合成音・<code>assets/sounds</code> の候補を試聴して割り当てる。音量と高さも決められる。
  出来た JSON を <code>tools/se_choice.json</code> に貼って <code>py -3 tools/se_build.py</code>（素材を Resources/Audio/SE に写し、se_config.json を書く）。候補を足したら <code>py -3 tools/se_sync.py</code>。</div>
  <div class="list" id="groups"></div>
  <div class="main" id="main"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script src="se_defaults.js"></script>
<script>
(function () {
  const D = window.BBB_SE || { defs: [], candidates: [], resources: [] };
  const KEY = "bbb_se_choice_v1";
  const $ = id => document.getElementById(id);
  let choice = {};                                   // key → { src, volume, pitch }
  try { choice = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { choice = {}; }
  const groups = []; D.defs.forEach(d => { if (!groups.includes(d.group)) groups.push(d.group); });
  let curGroup = groups[0] || "", curKey = D.defs[0] ? D.defs[0].key : "";
  const defOf = k => D.defs.find(d => d.key === k);
  const chOf = k => choice[k] || (choice[k] = { src: "", volume: -1, pitch: 1 });
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(choice)); } catch (e) {} };

  // 試聴: 音量と高さ（playbackRate）を掛けて鳴らす。ゲームは AudioSource.pitch で同じ
  let audio = null;
  function play(path, vol, pitch) {
    if (!path) return;
    if (audio) { audio.pause(); audio = null; }
    audio = new Audio(path); audio.volume = Math.min(1, Math.max(0, vol == null ? 1 : vol)); audio.playbackRate = pitch || 1; audio.preservesPitch = false;
    audio.play().catch(() => {});
  }
  // 今この割り当てで鳴る音のパス
  function pathOf(d) {
    const c = chOf(d.key);
    if (c.src && c.src.startsWith("resource:")) { const r = D.resources.find(x => x.name === c.src.slice(9)); return r ? r.path : null; }
    if (c.src === "synth") return d.synthWav;
    if (c.src) return "../" + c.src;
    return d.current || d.synthWav;                      // 既定: 今の素材 → 合成音
  }
  function volOf(d) { const c = chOf(d.key); return c.volume >= 0 ? c.volume : d.volume; }
  function labelOf(d) {
    const c = chOf(d.key);
    if (c.src && c.src.startsWith("resource:")) return "素材 " + c.src.slice(9);
    if (c.src === "synth") return "合成音";
    if (c.src) return c.src.replace(/^assets\/sounds\//, "");
    return d.current ? "素材 " + d.currentFile + "（今のまま）" : d.synthWav ? "合成音（今のまま）" : d.composite ? "他の音の組み合わせ（今のまま）" : "音なし";
  }

  function buildGroups() {
    $("groups").innerHTML = groups.map(g => '<button class="' + (g === curGroup ? "sel" : "") + '" data-g="' + g + '">' + g + '<small>' + D.defs.filter(d => d.group === g).length + '</small></button>').join("");
    $("groups").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { curGroup = b.getAttribute("data-g"); const f = D.defs.find(d => d.group === curGroup); if (f) curKey = f.key; render(); }));
  }
  function buildMain() {
    const defs = D.defs.filter(d => d.group === curGroup);
    const pic = defs[0] ? defs[0].pic : "";
    $("main").innerHTML = '<div class="scene">' + (pic ? '<img src="' + pic + '" alt="">' : "") +
      defs.map(d => {
        const changed = chOf(d.key).src || chOf(d.key).volume >= 0 || Math.abs(chOf(d.key).pitch - 1) > 1e-6;
        return '<div class="ev ' + (d.key === curKey ? "sel" : "") + '" data-k="' + d.key + '">' +
          '<div class="name">' + d.name + '</div>' +
          '<div class="cur">今: <b class="' + (changed ? "changed" : "") + '">' + labelOf(d) + '</b>　音量 ' + volOf(d).toFixed(2) + (Math.abs(chOf(d.key).pitch - 1) > 1e-6 ? '　高さ ×' + chOf(d.key).pitch.toFixed(2) : "") +
          ' <button class="mini" data-play="' + d.key + '">▶ 鳴らす</button></div>' +
          '<div class="when">' + d.when + '</div></div>';
      }).join("") + "</div>";
    $("main").querySelectorAll(".ev").forEach(el => el.addEventListener("click", e => { if (e.target.tagName === "BUTTON") return; curKey = el.getAttribute("data-k"); render(); }));
    $("main").querySelectorAll("button[data-play]").forEach(b => b.addEventListener("click", () => { const d = defOf(b.getAttribute("data-play")); play(pathOf(d), volOf(d), chOf(d.key).pitch); }));
  }
  function buildCtrl() {
    const d = defOf(curKey); if (!d) { $("ctrl").innerHTML = ""; return; }
    const c = chOf(d.key);
    const rows = [];
    rows.push({ src: "", tag: "既定", name: d.current ? "今の素材 " + d.currentFile : d.synthWav ? "合成音（素材なし）" : d.composite ? "他の音の組み合わせ（素材なし）" : "音なし", path: d.current || d.synthWav });
    if (d.synthWav) rows.push({ src: "synth", tag: "合成", name: "合成音 " + d.key + ".wav", path: d.synthWav });
    D.resources.forEach(r => rows.push({ src: "resource:" + r.name, tag: "素材", name: r.name, path: r.path }));
    D.candidates.forEach(x => rows.push({ src: x.path.replace(/^\.\.\//, ""), tag: "候補", name: x.name + "（" + Math.round(x.size / 1024) + "KB）", path: x.path }));
    $("ctrl").innerHTML = '<h2>' + d.group + ' / ' + d.name + '</h2><div class="note">' + d.when + '</div>' +
      '<div class="btns"><button class="primary" id="playCur">▶ 今の割り当てで鳴らす</button><button class="plain" id="resetOne">この音を既定に戻す</button></div>' +
      '<div class="row"><label>音量</label><input type="range" id="vol" min="0" max="1.5" step="0.05" value="' + volOf(d) + '"><input type="number" id="volN" min="0" max="1.5" step="0.05" value="' + volOf(d) + '"></div>' +
      '<div class="row"><label>高さ</label><input type="range" id="pit" min="0.5" max="2" step="0.01" value="' + c.pitch + '"><input type="number" id="pitN" min="0.5" max="2" step="0.01" value="' + c.pitch + '"></div>' +
      '<div class="note">音の元（押すと割り当て。▶ で試聴だけ）</div><div class="cands">' +
      rows.map(r => '<div class="' + ((c.src || "") === r.src ? "sel" : "") + '" data-src="' + r.src + '" data-path="' + (r.path || "") + '"><span class="tag">' + r.tag + '</span><span class="nm" title="' + r.name + '">' + r.name + '</span><button class="mini" data-p="' + (r.path || "") + '">▶</button></div>').join("") +
      '</div><div class="btns"><button class="plain" id="resetAll">全部既定に戻す</button></div>' +
      '<div class="note">JSON（tools/se_choice.json に丸ごと貼る）</div><pre id="json"></pre>';
    $("playCur").addEventListener("click", () => play(pathOf(d), volOf(d), c.pitch));
    $("resetOne").addEventListener("click", () => { delete choice[d.key]; store(); render(); });
    $("resetAll").addEventListener("click", () => { if (confirm("全部の割り当てを既定に戻す？")) { choice = {}; store(); render(); } });
    const syncVol = v => { c.volume = Math.round(v * 100) / 100; store(); $("vol").value = c.volume; $("volN").value = c.volume; buildMain(); updateJson(); };
    const syncPit = v => { c.pitch = Math.round(v * 100) / 100; store(); $("pit").value = c.pitch; $("pitN").value = c.pitch; buildMain(); updateJson(); };
    $("vol").addEventListener("input", e => syncVol(+e.target.value)); $("volN").addEventListener("change", e => syncVol(+e.target.value));
    $("pit").addEventListener("input", e => syncPit(+e.target.value)); $("pitN").addEventListener("change", e => syncPit(+e.target.value));
    $("ctrl").querySelectorAll(".cands div").forEach(el => el.addEventListener("click", e => {
      if (e.target.tagName === "BUTTON") { play(e.target.getAttribute("data-p"), volOf(d), c.pitch); return; }
      c.src = el.getAttribute("data-src"); store(); render(); play(pathOf(d), volOf(d), c.pitch);
    }));
    updateJson();
  }
  function updateJson() {
    const out = {};
    Object.keys(choice).forEach(k => { const c = choice[k]; if (c.src || c.volume >= 0 || Math.abs(c.pitch - 1) > 1e-6) out[k] = { src: c.src || "", volume: c.volume, pitch: c.pitch }; });
    const el = $("json"); if (el) el.textContent = JSON.stringify({ se: out }, null, 1);
  }
  function render() { buildGroups(); buildMain(); buildCtrl(); }
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>効果音ビューア</title>
<style>
  :root { --bg:#0f1b2d; --panel:#17263a; --panel2:#1d2f47; --line:#2f4460; --ink:#f4f6fa; --muted:#98a3b8; --gold:#f4cd7c; --green:#7ee0a0; --red:#ff7a7a; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic","Hiragino Sans",sans-serif; font-size:14px; }
  .wrap { display:grid; grid-template-columns: 200px 1fr 8px var(--ctrlw, 560px); gap:10px; padding:14px; height:100vh; box-sizing:border-box; }
  .grip { cursor:col-resize; background:var(--line); border-radius:4px; align-self:stretch; }
  .grip:hover { background:var(--gold); }
  @media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; height:auto; } .grip { display:none; } .main, .ctrl { max-height:70vh; } }
  h1 { font-size:18px; margin:0 0 4px; grid-column:1 / -1; }
  .sub { color:var(--muted); font-size:12px; grid-column:1 / -1; margin-top:-4px; line-height:1.6; }
  .list { background:var(--panel); border-radius:8px; padding:8px; align-self:start; }
  .list button { display:block; width:100%; text-align:left; font:inherit; background:transparent; color:var(--ink); border:0; border-radius:6px; padding:8px 10px; cursor:pointer; }
  .list button.sel { background:var(--panel2); color:var(--gold); font-weight:bold; }
  .list small { color:var(--muted); font-size:11px; margin-left:6px; }
  .main { background:var(--panel); border-radius:8px; padding:10px 12px; overflow-y:auto; min-height:0; }
  .scene { display:grid; grid-template-columns: 1fr; gap:10px; }
  .scene img { max-width:100%; border-radius:6px; border:1px solid var(--line); background:#000; }
  .ev { display:grid; grid-template-columns: 150px 1fr; gap:8px 12px; border-top:1px solid var(--line); padding:8px 0; align-items:center; }
  .ev.sel { background:var(--panel2); border-radius:6px; padding:8px; }
  .ev .name { font-weight:bold; color:var(--gold); cursor:pointer; }
  .ev .when { grid-column:1 / -1; color:var(--muted); font-size:12px; line-height:1.5; }
  .ev .cur { font-size:12px; color:var(--muted); }
  .ev .cur b { color:var(--ink); font-weight:normal; }
  .ev .cur .changed { color:var(--green); }
  .ctrl { background:var(--panel); border-radius:8px; padding:10px 12px; overflow-y:auto; min-height:0; }
  .ctrl h2 { font-size:14px; color:var(--gold); margin:4px 0 8px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; color:var(--muted); }
  .row label { flex:0 0 72px; }
  .row input[type=range] { flex:1; min-width:0; }
  .row.seek label { flex:0 0 120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .row.seek span { flex:0 0 96px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .row input[type=number] { flex:0 0 66px; width:66px; font:inherit; font-size:12px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:2px 4px; text-align:right; }
  .cands { max-height:52vh; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin:6px 0; }
  .cands div { display:flex; align-items:center; gap:6px; padding:5px 8px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .cands div:hover { background:var(--panel2); }
  .cands div.sel { background:var(--panel2); color:var(--gold); }
  .cands div .tag { flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:999px; background:var(--bg); color:var(--muted); }
  .cands details { border-bottom:1px solid var(--line); }
  .cands summary { cursor:pointer; padding:5px 8px; font-size:12px; color:var(--gold); user-select:none; list-style:none; }
  .cands summary::before { content:"▸ "; color:var(--muted); }
  .cands details[open] > summary::before { content:"▾ "; }
  .cands summary small { color:var(--muted); margin-left:6px; }
  .cands details details summary { padding-left:20px; color:var(--ink); }
  .cands details details div { padding-left:32px; }
  .cands details.ser summary { color:var(--ink); padding-left:32px; }
  .cands details.ser div { padding-left:44px; }
  .cands .tg { flex:0 0 auto; font-size:10px; padding:0 5px; border-radius:4px; background:#2a3f5c; color:#cfe0ff; }
  .cands .sz { flex:0 0 auto; font-size:10px; color:var(--muted); }
  .cands div .nm { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all; line-height:1.3; }
  .cands div button { flex:0 0 auto; }
  button.primary { font:inherit; font-weight:bold; background:var(--gold); color:#3b2a12; border:0; border-radius:6px; padding:8px 16px; cursor:pointer; }
  button.plain { font:inherit; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.mini { font:inherit; font-size:11px; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; }
  pre { background:var(--bg); padding:8px; border-radius:6px; font-size:12px; white-space:pre-wrap; user-select:all; margin:8px 0 0; max-height:30vh; overflow:auto; }
  .note { color:var(--muted); font-size:12px; line-height:1.6; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>効果音ビューア</h1>
  <div class="sub">場面ごとに「いつ鳴るか」と絵を見ながら、今の音・合成音・<code>assets/sounds</code> の候補を試聴して割り当てる。音量と高さも決められる。
  出来た JSON を <code>tools/se_choice.json</code> に貼って <code>py -3 tools/se_build.py</code>（素材を Resources/Audio/SE に写し、se_config.json を書く）。候補を足したら <code>py -3 tools/se_sync.py</code>。</div>
  <div class="list" id="groups"></div>
  <div class="main" id="main"></div>
  <div class="grip" id="grip" title="ドラッグで右の欄の幅を変える"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script src="se_defaults.js"></script>
<script>
(function () {
  const D = window.BBB_SE || { defs: [], candidates: [], resources: [], bgmDefs: [], bgmCandidates: [], bgmResources: [] };
  // BGM は「BGM」という群として効果音の後ろに並べる（choice は bgm: で分ける）
  (D.bgmDefs || []).forEach(d => { d.group = "BGM"; d.bgm = true; });
  const ALL = (D.defs || []).concat(D.bgmDefs || []);
  const KEY = "bbb_se_choice_v2";
  const $ = id => document.getElementById(id);
  let choice = {};                                   // key → { src, volume, pitch }（BGM のキーは "bgm:" を頭に）
  try { choice = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { choice = {}; }
  const groups = []; ALL.forEach(d => { if (!groups.includes(d.group)) groups.push(d.group); });
  let curGroup = groups[0] || "", curKey = ALL[0] ? ALL[0].key : "";
  const defOf = k => ALL.find(d => d.key === k);
  const ckey = d => (d.bgm ? "bgm:" : "") + d.key;
  const chOf = k => choice[k] || (choice[k] = { src: "", volume: -1, pitch: 1 });
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(choice)); } catch (e) {} };

  // 試聴: 音量と高さ（playbackRate）を掛けて鳴らす。ゲームは AudioSource.pitch で同じ
  let audio = null;
  let seeking = false;
  function play(path, vol, pitch, loop) {
    if (!path) return;
    if (audio) { audio.pause(); audio = null; }
    audio = new Audio(path); audio.volume = Math.min(1, Math.max(0, vol == null ? 1 : vol)); audio.playbackRate = pitch || 1; audio.preservesPitch = false; audio.loop = !!loop;
    const nm = $("seekName"); if (nm) nm.textContent = decodeURIComponent(path.split("/").pop());
    audio.addEventListener("timeupdate", tick); audio.addEventListener("loadedmetadata", tick); audio.addEventListener("ended", tick);
    audio.play().catch(() => {});
  }
  function stop() { if (audio) { audio.pause(); audio = null; } tick(); }
  // 再生バー: 現在 / 長さ（秒）。つまみを動かすと頭出し
  function tick() {
    const bar = $("seek"), t = $("seekT"); if (!bar || !t) return;
    if (!audio || !isFinite(audio.duration)) { if (!audio) { bar.value = 0; t.textContent = "0.00 / 0.00"; } return; }
    if (!seeking) bar.value = Math.round(audio.currentTime / audio.duration * 1000);
    t.textContent = audio.currentTime.toFixed(2) + " / " + audio.duration.toFixed(2) + " 秒";
  }
  // 今この割り当てで鳴る音のパス
  function pathOf(d) {
    const c = chOf(ckey(d));
    if (c.src && c.src.startsWith("resource:")) { const r = (d.bgm ? D.bgmResources : D.resources).find(x => x.name === c.src.slice(9)); return r ? r.path : null; }
    if (c.src === "synth") return d.synthWav;
    if (c.src) return "../" + c.src;
    return d.current || d.synthWav;                      // 既定: 今の素材 → 合成音
  }
  function volOf(d) { const c = chOf(ckey(d)); return c.volume >= 0 ? c.volume : d.volume; }
  function labelOf(d) {
    const c = chOf(ckey(d));
    if (c.src && c.src.startsWith("resource:")) return "素材 " + c.src.slice(9);
    if (c.src === "synth") return "合成音";
    if (c.src) return c.src.replace(/^assets\/sounds\//, "");
    return d.current ? "素材 " + d.currentFile + "（今のまま）" : d.synthWav ? "合成音（今のまま）" : d.composite ? "他の音の組み合わせ（今のまま）" : "音なし";
  }

  function buildGroups() {
    $("groups").innerHTML = groups.map(g => '<button class="' + (g === curGroup ? "sel" : "") + '" data-g="' + g + '">' + g + '<small>' + ALL.filter(d => d.group === g).length + '</small></button>').join("");
    $("groups").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { curGroup = b.getAttribute("data-g"); const f = ALL.find(d => d.group === curGroup); if (f) curKey = f.key; render(); }));
  }
  function buildMain() {
    const defs = ALL.filter(d => d.group === curGroup);
    const pic = defs[0] ? defs[0].pic : "";
    $("main").innerHTML = '<div class="scene">' + (pic ? '<img src="' + pic + '" alt="">' : "") +
      defs.map(d => {
        const changed = chOf(ckey(d)).src || chOf(ckey(d)).volume >= 0 || Math.abs(chOf(ckey(d)).pitch - 1) > 1e-6;
        return '<div class="ev ' + (d.key === curKey ? "sel" : "") + '" data-k="' + d.key + '">' +
          '<div class="name">' + d.name + '</div>' +
          '<div class="cur">今: <b class="' + (changed ? "changed" : "") + '">' + labelOf(d) + '</b>　音量 ' + volOf(d).toFixed(2) + (Math.abs(chOf(ckey(d)).pitch - 1) > 1e-6 ? '　高さ ×' + chOf(ckey(d)).pitch.toFixed(2) : "") +
          ' <button class="mini" data-play="' + d.key + '">▶ 鳴らす</button></div>' +
          '<div class="when">' + d.when + '</div></div>';
      }).join("") + "</div>";
    $("main").querySelectorAll(".ev").forEach(el => el.addEventListener("click", e => { if (e.target.tagName === "BUTTON") return; curKey = el.getAttribute("data-k"); render(); }));
    $("main").querySelectorAll("button[data-play]").forEach(b => b.addEventListener("click", () => { const d = defOf(b.getAttribute("data-play")); play(pathOf(d), volOf(d), chOf(ckey(d)).pitch, d.bgm); }));
  }
  function buildCtrl() {
    const d = defOf(curKey); if (!d) { $("ctrl").innerHTML = ""; return; }
    const c = chOf(ckey(d)); curSrc = c.src || "";
    const rows = [];
    rows.push({ src: "", tag: "既定", name: d.current ? "今の素材 " + d.currentFile : d.synthWav ? "合成音（素材なし）" : d.composite ? "他の音の組み合わせ（素材なし）" : "音なし", path: d.current || d.synthWav });
    if (d.synthWav) rows.push({ src: "synth", tag: "合成", name: "合成音 " + d.key + ".wav", path: d.synthWav });
    (d.bgm ? D.bgmResources : D.resources).forEach(r => rows.push({ src: "resource:" + r.name, tag: "素材", name: r.name, path: r.path }));
    // 候補は効果音・BGM・歌もの全部（どの場面でも同じ木。魔王魂 → 効果音 / BGM / 歌もの）
    [].concat(D.candidates || [], D.bgmCandidates || []).forEach(x => rows.push({ src: x.path.replace(/^\.\.\//, ""), tag: "候補", name: x.name, label: x.label || "", size: Math.round(x.size / 1024), path: x.path, series: x.series || "", tags: x.tags || [] }));
    $("ctrl").innerHTML = '<h2>' + d.group + ' / ' + d.name + '</h2><div class="note">' + d.when + '</div>' +
      '<div class="btns"><button class="primary" id="playCur">▶ 今の割り当てで鳴らす</button><button class="plain" id="stopCur">■ 止める</button><button class="plain" id="resetOne">この音を既定に戻す</button></div>' +
      '<div class="row seek"><label id="seekName">—</label><input type="range" id="seek" min="0" max="1000" step="1" value="0"><span id="seekT">0.00 / 0.00</span></div>' +
      '<div class="row"><label>音量</label><input type="range" id="vol" min="0" max="1.5" step="0.05" value="' + volOf(d) + '"><input type="number" id="volN" min="0" max="1.5" step="0.05" value="' + volOf(d) + '"></div>' +
      (d.bgm ? '' : '<div class="row"><label>高さ</label><input type="range" id="pit" min="0.5" max="2" step="0.01" value="' + c.pitch + '"><input type="number" id="pitN" min="0.5" max="2" step="0.01" value="' + c.pitch + '"></div>') +
      '<div class="note">音の元（押すと割り当て。▶ で試聴だけ）</div><input type="text" id="filt" placeholder="絞り込み（名前かタグ。例: 攻撃 / コイン / 決定 / 8bit）" style="width:100%;box-sizing:border-box;font:inherit;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;margin:4px 0"><div class="cands">' +
      rows.filter(r => r.tag !== "候補").map(rowHtml).join("") + candTree(rows.filter(r => r.tag === "候補"), c) +
      '</div><div class="btns"><button class="plain" id="resetAll">全部既定に戻す</button></div>' +
      '<div class="note">JSON（tools/se_choice.json に丸ごと貼る）</div><pre id="json"></pre>';
    $("playCur").addEventListener("click", () => play(pathOf(d), volOf(d), c.pitch, d.bgm));
    $("seek").addEventListener("input", e => { seeking = true; if (audio && isFinite(audio.duration)) { audio.currentTime = audio.duration * e.target.value / 1000; tick(); } });
    $("seek").addEventListener("change", () => { seeking = false; });
    tick();
    $("stopCur").addEventListener("click", stop);
    $("resetOne").addEventListener("click", () => { delete choice[ckey(d)]; store(); render(); });
    $("resetAll").addEventListener("click", () => { if (confirm("全部の割り当てを既定に戻す？")) { choice = {}; store(); render(); } });
    const syncVol = v => { c.volume = Math.round(v * 100) / 100; store(); $("vol").value = c.volume; $("volN").value = c.volume; buildMain(); updateJson(); };
    const syncPit = v => { c.pitch = Math.round(v * 100) / 100; store(); $("pit").value = c.pitch; $("pitN").value = c.pitch; buildMain(); updateJson(); };
    $("vol").addEventListener("input", e => syncVol(+e.target.value)); $("volN").addEventListener("change", e => syncVol(+e.target.value));
    if ($("pit")) { $("pit").addEventListener("input", e => syncPit(+e.target.value)); $("pitN").addEventListener("change", e => syncPit(+e.target.value)); }
    $("ctrl").querySelectorAll(".cands div").forEach(el => el.addEventListener("click", e => {
      if (e.target.tagName === "BUTTON") { play(e.target.getAttribute("data-p"), volOf(d), c.pitch, d.bgm); return; }
      c.src = el.getAttribute("data-src"); store(); render(); play(pathOf(d), volOf(d), c.pitch, d.bgm);
    }));
    $("filt").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      $("ctrl").querySelectorAll(".cands div[data-src]").forEach(el => { el.style.display = !q || (el.textContent + " " + el.getAttribute("data-src") + " " + (el.getAttribute("data-tags") || "")).toLowerCase().includes(q) ? "" : "none"; });
      $("ctrl").querySelectorAll(".cands details").forEach(dt => { const vis = [...dt.querySelectorAll("div[data-src]")].some(el => el.style.display !== "none"); dt.style.display = vis ? "" : "none"; if (q) dt.open = true; });
    });
    updateJson();
  }
  // 候補の 1 行
  function rowHtml(r) {
    const tags = (r.tags || []).map(t => '<span class="tg">' + t + '</span>').join("");
    const size = r.size ? '<span class="sz">' + r.size + 'KB</span>' : "";
    return '<div class="' + (curSrc === r.src ? "sel" : "") + '" data-src="' + r.src + '" data-path="' + (r.path || "") + '" data-tags="' + (r.tags || []).join(" ") + " " + (r.file || "") + '"><span class="tag">' + r.tag + '</span><span class="nm" title="' + (r.file || r.name) + '">' + r.name + '</span>' + tags + size + '<button class="mini" data-p="' + (r.path || "") + '">▶</button></div>';
  }
  let curSrc = "";
  const SOURCE_NAME = { springin: "Springin' Sound Stock", maou: "魔王魂", bgm: "assets/sounds/bgm" };
  const CAT_NAME = { voice: "声", magic: "魔法", magical: "マジカル", inst: "楽器", sound: "生活音", system: "システム", onepoint: "ワンポイント", effect: "エフェクト", chime: "チャイム", jingle: "ジングル", neorock: "ネオロック", acoustic: "アコースティック", cyber: "サイバー", ethnic: "エスニック", piano: "ピアノ", orchestra: "オーケストラ", fantasy: "ファンタジー", healing: "ヒーリング", karaoke: "カラオケ", other: "その他", battle: "戦闘", staging: "演出", life: "生活", machine: "機械・乗り物", environment: "環境音", system: "ボタン・システム", "nature-animals": "自然・動物", retrogame: "レトロゲーム", voice: "声", bgm: "BGM", "bgm-short": "10 秒 BGM", se: "効果音", song: "歌もの", attack: "攻撃", enemy: "敵", materials: "素材" };
  // 候補を フォルダの段（出どころ → カテゴリ → 種類 …）どおりの木に。選んでいる物のある枝は開いておく
  function candTree(rows, c) {
    const root = { dirs: {}, files: [] };
    rows.forEach(r => {
      const parts = r.name.split("/"); const disp = parts.pop();
      const label = r.label && r.label !== disp.replace(/\.[a-z0-9]+$/i, "") ? r.label : disp.replace(/\.[a-z0-9]+$/i, "");
      const series = r.label ? label.replace(/[ _\-]?[0-9０-９]+$/, "") || label : r.series;
      let node = root;
      (parts.length ? parts : ["（直下）"]).forEach(seg => { node = node.dirs[seg] = node.dirs[seg] || { dirs: {}, files: [] }; });
      node.files.push(Object.assign({}, r, { name: label, file: disp, series }));
    });
    const count = n => n.files.length + Object.values(n.dirs).reduce((a, d) => a + count(d), 0);
    const hasSel = n => n.files.some(r => r.src === c.src) || Object.values(n.dirs).some(hasSel);
    const html = (n, depth) => Object.keys(n.dirs).sort().map(k => {
      const d = n.dirs[k];
      // 曲ごとのフォルダ（歌もの）は、その曲の歌ありの表示名を見出しにする
      const own = d.files.find(r => r.file === "maou_" + k + ".mp3");
      const nm = depth === 0 ? (SOURCE_NAME[k] || k) : (CAT_NAME[k] || (own ? own.name : k));
      return '<details' + (hasSel(d) ? " open" : "") + '><summary>' + nm + '<small>' + count(d) + '</small></summary>' + html(d, depth + 1) + seriesHtml(d.files) + '</details>';
    }).join("") + (depth === 0 ? seriesHtml(n.files) : "");
    return html(root, 0);
  }
  // シリーズ（末尾の番号を除いた名前）が同じ物は 1 つに畳む
  function seriesHtml(list) {
    const by = {}; const order = [];
    list.forEach(r => { const k = r.series || r.name; if (!by[k]) { by[k] = []; order.push(k); } by[k].push(r); });
    return order.map(k => {
      const l = by[k];
      if (l.length < 2) return rowHtml(l[0]);
      const tags = [...new Set(l.flatMap(r => r.tags || []))].map(t => '<span class="tg">' + t + '</span>').join("");
      return '<details class="ser"' + (l.some(r => r.src === curSrc) ? " open" : "") + '><summary>' + k + '<small>×' + l.length + '</small>' + tags + '</summary>' + l.map(rowHtml).join("") + '</details>';
    }).join("");
  }
  function updateJson() {
    const se = {}, bgm = {};
    Object.keys(choice).forEach(k => { const c = choice[k]; if (!(c.src || c.volume >= 0 || Math.abs(c.pitch - 1) > 1e-6)) return; const e = { src: c.src || "", volume: c.volume, pitch: c.pitch }; if (k.startsWith("bgm:")) bgm[k.slice(4)] = e; else se[k] = e; });
    const el = $("json"); if (el) el.textContent = JSON.stringify({ se: se, bgm: bgm }, null, 1);
  }
  // 描き直しでスクロールと折りたたみを戻さない（本人: クリックのたびに先頭へ戻るのは何度も見た）
  // 描き直す前に、スクロールできる箱の位置と、開いている details の見出しを覚えて、描き直した後に戻す
  function render() {
    const scrolls = [...document.querySelectorAll(".main, .ctrl, .cands")].map(el => [el.className, el.scrollTop]);
    const opened = new Set([...document.querySelectorAll(".cands details[open] > summary")].map(x => x.textContent));
    const closed = new Set([...document.querySelectorAll(".cands details:not([open]) > summary")].map(x => x.textContent));
    buildGroups(); buildMain(); buildCtrl();
    document.querySelectorAll(".cands details").forEach(dt => { const k = dt.querySelector(":scope > summary").textContent; if (opened.has(k)) dt.open = true; else if (closed.has(k)) dt.open = false; });
    scrolls.forEach(([cls, top]) => { const el = document.querySelector("." + cls.split(" ")[0]); if (el) el.scrollTop = top; });
  }
  // 右の欄の幅: 境の取っ手をドラッグ。覚えておく
  (function () {
    const grip = $("grip"), wrap = document.querySelector(".wrap");
    let w = 560; try { w = +localStorage.getItem("bbb_se_ctrlw") || 560; } catch (e) {}
    const apply = v => { w = Math.min(window.innerWidth - 420, Math.max(320, v)); wrap.style.setProperty("--ctrlw", w + "px"); };
    apply(w);
    grip.addEventListener("mousedown", e => {
      e.preventDefault(); const x0 = e.clientX, w0 = w;
      const move = ev => apply(w0 + (x0 - ev.clientX));
      const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); try { localStorage.setItem("bbb_se_ctrlw", w); } catch (e) {} };
      document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
    });
  })();
  render();
})();
</script>
</body>
</html>

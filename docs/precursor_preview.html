<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>エンカウント前兆 演出比較</title>
<style>
  :root { --bg:#0a0d16; --panel:#151b2b; --edge:#2a3554; --text:#f4f6fa; --sub:#98a3b8; --accent:#ff4d6d; --gold:#ffcf3f; --gold2:#c8961e; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:16px; margin:0 0 4px; color:var(--sub); font-weight:600; }
  .sub { font-size:12px; color:#5f6a80; margin-bottom:10px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; max-width:980px; }
  button { background:#27304a; color:var(--text); border:1px solid var(--edge); border-radius:10px; padding:10px 13px; font-size:13px; cursor:pointer; }
  button:hover { background:#33405f; }
  button.sel { background:var(--accent); border-color:var(--accent); }
  button.base { background:#1b2233; }
  .stage { position:relative; width:960px; height:540px; background:var(--bg); border-radius:14px; overflow:hidden; box-shadow:0 10px 40px #000a; }
  .card { position:absolute; background:var(--panel); border:1px solid var(--edge); border-radius:12px; }
  .area { left:8px; top:8px; width:944px; height:252px; overflow:hidden; }
  /* 背景レイヤー（パララックス相当） */
  .sky { position:absolute; inset:0; background:linear-gradient(#4a7ab5 0%, #8fb8dd 50%, #b9d2e8 70%, #6a8f45 71%, #3f5f2a 100%); transition:filter .6s, opacity .6s; }
  .clouds { position:absolute; inset:0; opacity:0; transition:opacity .6s;
    background:radial-gradient(ellipse 200px 60px at 20% 25%, #2f3948cc, transparent 70%),
               radial-gradient(ellipse 260px 70px at 60% 18%, #26303ecc, transparent 70%),
               radial-gradient(ellipse 220px 60px at 88% 30%, #2f3948cc, transparent 70%); }
  .band { position:absolute; left:1px; top:1px; right:1px; height:28px; background:#0c1019; border-radius:12px 12px 0 0; display:flex; align-items:center; gap:8px; padding:0 8px; font-size:12px; font-weight:700; box-sizing:border-box; z-index:9; }
  .chip { padding:2px 10px; border-radius:10px; background:#27304a; }
  .chip.red { background:#d91e33; } .chip.pink { background:#7f2440; }
  .hero { position:absolute; left:120px; bottom:6px; width:104px; height:160px; background:#e8c37a; border-radius:38px 38px 10px 10px; transition:transform .3s; }
  .hero::after { content:""; position:absolute; left:26px; top:34px; width:52px; height:16px; background:#3a2c1a; border-radius:4px; }
  .enemy { position:absolute; right:180px; bottom:14px; width:118px; height:118px; background:#7b3fb0; border-radius:50%; opacity:0; transform:translateX(220px); }
  .mid { top:268px; height:196px; }
  .disp { left:8px; width:218px; } .side { right:8px; width:218px; }
  .cab { left:234px; width:492px; border:3px solid var(--gold2); background:#1c2438; }
  .reel { position:absolute; top:8px; width:148px; height:180px; background:#f2f2f2; border-radius:6px; }
  .reel::after { content:""; position:absolute; left:0; right:0; top:60px; height:60px; border-top:2px solid #ffcf3f88; border-bottom:2px solid #ffcf3f88; }
  .ctrl { position:absolute; top:476px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .bet { left:8px; width:218px; background:var(--accent); } .stop { width:148px; background:#27304a; } .auto { right:8px; width:218px; background:#27304a; }
  .label { position:absolute; top:6px; left:12px; font-size:11px; color:var(--sub); font-weight:700; }
  /* 前兆演出レイヤー */
  .fx { position:absolute; left:8px; top:36px; width:944px; height:224px; pointer-events:none; overflow:hidden; }
  .darken { position:absolute; inset:0; background:#000; opacity:0; }
  .vignette { position:absolute; inset:-40px; opacity:0; box-shadow:inset 0 0 90px 40px #7a0016; }
  .silhouette { position:absolute; right:-140px; bottom:14px; width:118px; height:118px; background:#000; border-radius:50%; opacity:0; }
  .backshadow { position:absolute; left:-160px; bottom:8px; width:150px; height:150px; background:radial-gradient(circle, #000d 40%, transparent 72%); opacity:0; }
  .lightning { position:absolute; inset:0; background:#fff; opacity:0; }
  .trace { position:absolute; bottom:16px; font-size:26px; opacity:0; color:#3a2c1a; }
  .runner { position:absolute; bottom:8px; left:-90px; width:52px; height:92px; background:#c8a060; border-radius:20px 20px 6px 6px; opacity:0; }
  .runner::after { content:""; position:absolute; left:10px; top:-22px; width:32px; height:30px; background:#f0d6b0; border-radius:50%; }
  .bubble { position:absolute; bottom:110px; left:-40px; background:#fff; color:#111; font-size:13px; font-weight:700; padding:6px 12px; border-radius:12px; opacity:0; white-space:nowrap; }
  .emblems { position:absolute; right:14px; top:10px; display:flex; gap:8px; opacity:0; }
  .emblem { width:30px; height:34px; border-radius:6px 6px 12px 12px; background:#1b2233; border:2px solid #3b4767; display:flex; align-items:center; justify-content:center; font-size:15px; color:#3b4767; transition:all .25s; }
  .emblem.on { background:#4a3a12; border-color:var(--gold); color:var(--gold); box-shadow:0 0 14px #ffcf3f99; }
  /* セリフ枠（会話UI）。リールのすぐ上＝表示域の下端に置く */
  .talk { position:absolute; left:50%; bottom:8px; width:620px; height:54px; margin-left:-310px; background:#0a0f14f0; border:1px solid var(--edge); border-radius:14px; opacity:0; transition:opacity .25s; box-shadow:0 6px 18px #000a; }
  .talkName { position:absolute; left:10px; top:5px; height:20px; line-height:20px; padding:0 12px; border-radius:10px; background:#3ddc84; color:#0a0d16; font-size:11px; font-weight:800; }
  .talkText { position:absolute; left:14px; right:14px; top:24px; height:24px; line-height:24px; font-size:15px; color:var(--text); }
  /* ENGAGE 叩きつけ（案1・採用済み） */
  .eband { position:absolute; left:-10%; right:-10%; top:50%; height:96px; transform:translateY(-50%) scaleX(0); background:#000c; border-top:2px solid #ff4d6d; border-bottom:2px solid #ff4d6d; }
  .etitle { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%) scale(1.5); text-align:center; font-weight:900; font-size:56px; letter-spacing:5px; color:#fff; text-shadow:0 3px 0 #7a0016, 0 0 24px #ff4d6d; opacity:0; font-family: Impact, "Arial Black", sans-serif; }
  .flash { position:absolute; inset:0; background:#ff4d6d; opacity:0; }
  .note { max-width:960px; color:var(--sub); font-size:13px; line-height:1.7; margin-top:12px; }
  .note b { color:var(--text); }
  .shake { animation: shake .3s linear; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,4px)} 40%{transform:translate(5px,-5px)} 60%{transform:translate(-4px,-3px)} 80%{transform:translate(4px,3px)} }
  .beat { animation: beat .5s ease-out; }
  @keyframes beat { 0%{transform:scale(1)} 12%{transform:scale(1.012)} 30%{transform:scale(1)} 45%{transform:scale(1.008)} 70%{transform:scale(1)} }
</style>
</head>
<body>
<h1>エンカウント前兆 演出比較（前兆 3G → 敵出現 → ENEMY ENGAGE 叩きつけ）</h1>
<div class="sub">「現状」は今の実装。1〜6 が新案。前兆の文字はセリフ枠（リールのすぐ上）に出します。ENGAGE の叩きつけ（採用済み案1）は全案共通で最後。</div>
<div class="bar">
  <button class="base" data-k="0">現状（暗転＋影）</button>
  <button data-k="1">1 環境変化</button>
  <button data-k="2">2 追跡（背後）</button>
  <button data-k="3">3 痕跡</button>
  <button data-k="4">4 旅人が逃走</button>
  <button data-k="5">5 心音</button>
  <button data-k="6">6 収集（紋章3枚）</button>
  <label style="display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;margin-left:8px"><input type="checkbox" id="slow"> 0.5倍速</label>
</div>
<div class="stage" id="stage">
  <div class="card area">
    <div class="sky" id="sky"></div>
    <div class="clouds" id="clouds"></div>
    <div class="band"><span class="chip" id="mode">通常</span><span class="chip pink" id="pre" style="display:none">前兆 3 G</span><span style="flex:1;text-align:center" id="msg"></span><span style="color:var(--gold)">123 G</span></div>
    <div class="hero" id="hero"></div>
    <div class="enemy" id="enemy"></div>
  </div>
  <div class="fx" id="fx">
    <div class="darken" id="darken"></div>
    <div class="backshadow" id="backshadow"></div>
    <div class="silhouette" id="silhouette"></div>
    <div class="trace" id="t1">🐾</div><div class="trace" id="t2">🩸</div><div class="trace" id="t3">🪧</div>
    <div class="runner" id="runner"></div>
    <div class="bubble" id="bubble"></div>
    <div class="emblems" id="emblems"><div class="emblem" id="em0">▲</div><div class="emblem" id="em1">▲</div><div class="emblem" id="em2">▲</div></div>
    <div class="vignette" id="vignette"></div>
    <div class="lightning" id="lightning"></div>
    <div class="talk" id="talk"><span class="talkName" id="talkName">主人公</span><span class="talkText" id="talkText"></span></div>
    <div class="eband" id="eband"></div>
    <div class="etitle" id="etitle">ENEMY ENGAGE!</div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="card mid disp"><div class="label">CREDIT</div></div>
  <div class="card mid cab"><div class="reel" style="left:12px"></div><div class="reel" style="left:168px"></div><div class="reel" style="left:324px"></div></div>
  <div class="card mid side"><div class="label">PLAYER</div></div>
  <div class="ctrl bet">MAX BET</div>
  <div class="ctrl stop" style="left:246px">STOP</div>
  <div class="ctrl stop" style="left:402px">STOP</div>
  <div class="ctrl stop" style="left:558px">STOP</div>
  <div class="ctrl auto">AUTO</div>
</div>
<div class="note" id="note">案を選んでください。前兆は 1G ごとに段階が上がり、3G 目の終わりに敵が出現します。</div>

<script>
const $ = id => document.getElementById(id);
const S = () => ($('slow').checked ? 2 : 1);
const sleep = ms => new Promise(r => setTimeout(r, ms * S()));
let busy = false;

const notes = {
  0: "<b>現状</b>: 画面が段階的に暗くなり、右端から敵のシルエットが近づく。<br>長所: 実装済み・軽い / 短所: 毎回同じで3回目から見なくなる。敵の種類も強さも分からない",
  1: "<b>環境変化</b>: 空が曇る → 雷が光る → 暗転。世界そのものが変わる。パララックスの層を差し替える実装。<br>長所: 一目で「通常時が終わった」と分かる / 短所: 背景素材が要る。暗くしすぎるとリールが読めない",
  2: "<b>追跡（背後）</b>: 敵は背後にいる。左端に影が差し、足音が右→左へ抜け、主人公が振り返る。<br>長所: 「まだ見えない」怖さが出る / 短所: 音が主役なのでスマホ無音だと弱い。影だけは必ず見せる",
  3: "<b>痕跡</b>: 足跡 → 血痕 → 壊れた看板、が背景を流れてくる。「すでにそこにいた」証拠が増える。<br>長所: 世界観が濃くなる。痕跡の種類で敵の示唆ができる / 短所: 小さいと気付かれない",
  4: "<b>旅人が逃走</b>: 旅人が逆方向（左→右）に走って通り過ぎ、警告だけ残す。既存の旅人システムを再利用。<br>長所: 実装が軽い・このゲーム固有 / 短所: 旅人の出現と紛らわしい。走る向きで区別させる",
  5: "<b>心音</b>: 主人公の主観。心拍で画面全体が脈打ち、周辺が赤黒く沈む。段階で心拍が速くなる。<br>長所: 段階の強弱が体で分かる / 短所: 全画面が動くので疲れる・酔う。明滅の自主基準に注意",
  6: "<b>収集（紋章3枚）</b>: 右上に紋章が1Gに1枚ずつ点灯。3枚揃った瞬間に出現。<br>長所: 進行が確定的に読める・情報として機能 / 短所: 読めるがゆえに煽りが死ぬ。ガセ（途中で止まる）が要る",
};

function reset() {
  ['darken','backshadow','silhouette','vignette','lightning','talk','flash','runner','bubble','emblems','clouds','t1','t2','t3'].forEach(id => { const e = $(id); e.style.transition='none'; e.style.opacity = 0; });
  $('talkText').textContent = '';
  $('silhouette').style.right = '-140px';
  $('backshadow').style.left = '-160px';
  ['t1','t2','t3'].forEach((id,i) => { $(id).style.left = '980px'; });
  $('runner').style.left = '-90px'; $('bubble').style.left = '-40px';
  ['em0','em1','em2'].forEach(id => $(id).classList.remove('on'));
  $('sky').style.filter = 'none';
  $('hero').style.transform = 'none';
  const en = $('enemy'); en.style.transition='none'; en.style.opacity = 0; en.style.transform = 'translateX(220px)';
  $('eband').style.transition='none'; $('eband').style.transform = 'translateY(-50%) scaleX(0)';
  $('etitle').style.transition='none'; $('etitle').style.opacity = 0; $('etitle').style.transform = 'translateY(-50%) scale(1.5)';
  $('mode').textContent = '通常'; $('pre').style.display = 'none'; $('msg').textContent = '';
  $('stage').classList.remove('shake','beat');
}
function shake() { const s = $('stage'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
function beat() { const s = $('stage'); s.classList.remove('beat'); void s.offsetWidth; s.classList.add('beat'); }
async function flash(el, color, peak, ms) { el.style.background = color; el.style.transition = 'none'; el.style.opacity = peak; await sleep(30); el.style.transition = `opacity ${ms}ms`; el.style.opacity = 0; }
function stageHead(g) { $('mode').textContent = '前兆'; $('pre').style.display = ''; $('pre').textContent = `前兆 ${g+1} / 3 G`; }
/** セリフ枠に 1 行出す。who: 'hero' | 'traveler'。タイプライタ表示。 */
async function say(text, who) {
  const box = $('talk'), nm = $('talkName'), tx = $('talkText');
  nm.textContent = who === 'traveler' ? '旅人' : '主人公';
  nm.style.background = who === 'traveler' ? '#ffcf3f' : '#3ddc84';
  box.style.transition = 'opacity .25s'; box.style.opacity = 1;
  tx.textContent = '';
  for (let i = 1; i <= text.length; i++) { tx.textContent = text.slice(0, i); await sleep(28); }
}

async function enemyIn() {
  $('talk').style.transition = 'opacity .25s'; $('talk').style.opacity = 0;
  const en = $('enemy'); en.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s'; en.style.opacity = 1; en.style.transform = 'translateX(0)';
  await sleep(500); shake();
}
async function engageSlam() {
  const b = $('eband'), t = $('etitle');
  b.style.transition = 'transform .18s cubic-bezier(.2,.9,.2,1)'; b.style.transform = 'translateY(-50%) scaleX(1)';
  await sleep(150);
  t.style.transition = 'none'; t.style.opacity = 1; t.style.transform = 'translateY(-50%) scale(1.5)';
  await sleep(20);
  t.style.transition = 'transform .16s cubic-bezier(.3,1.4,.5,1)'; t.style.transform = 'translateY(-50%) scale(1)';
  await sleep(160); shake(); flash($('flash'), '#ff4d6d', .5, 500);
  await sleep(1300);
  t.style.transition = 'opacity .3s'; b.style.transition = 'opacity .3s'; t.style.opacity = 0; b.style.opacity = 0;
  await sleep(300);
}

const plays = {
  // 現状: 暗転 + 右から影
  async 0() {
    const texts = ['ん……？', '……なにかいるな', '……来るぞ'];
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      const k = (g + 1) / 4;
      $('darken').style.transition = 'opacity .4s'; $('darken').style.opacity = 0.55 * k;
      const s = $('silhouette'); s.style.transition = 'right .4s, opacity .4s'; s.style.opacity = 0.85 * k; s.style.right = (200 - 90 * (g + 1)) + 'px';
      shake();
      await say(texts[g]); await sleep(450);
    }
    $('darken').style.opacity = 0; $('silhouette').style.opacity = 0;
    await enemyIn(); await engageSlam();
  },
  // 1 環境変化: 曇る → 雷 → 暗転
  async 1() {
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      if (g === 0) { $('clouds').style.transition='opacity .8s'; $('clouds').style.opacity = 1; $('sky').style.filter = 'saturate(.7) brightness(.85)'; await say('雲が出てきたな'); }
      if (g === 1) { $('sky').style.filter = 'saturate(.45) brightness(.6) hue-rotate(-12deg)'; await say('……風向きが変わった');
        for (let i = 0; i < 2; i++) { await flash($('lightning'), '#fff', .85, 180); await sleep(240); } shake(); }
      if (g === 2) { $('sky').style.filter = 'saturate(.2) brightness(.34)'; $('darken').style.transition='opacity .5s'; $('darken').style.opacity = .45;
        await say('……嵐が来る'); await flash($('lightning'), '#fff', 1, 260); shake(); }
      await sleep(450);
    }
    $('darken').style.opacity = 0;
    await enemyIn(); await engageSlam();
  },
  // 2 追跡: 左端に影、足音が右→左、主人公が振り返る
  async 2() {
    const texts = ['……足音？', '……近づいてくる', '……後ろか'];
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      const b = $('backshadow'); b.style.transition = 'left .5s, opacity .5s'; b.style.opacity = 0.35 + 0.3 * g; b.style.left = (-160 + 60 * (g + 1)) + 'px';
      $('darken').style.transition='opacity .4s'; $('darken').style.opacity = 0.2 * (g + 1);
      if (g === 2) { $('hero').style.transform = 'scaleX(-1)'; shake(); }   // 振り返る
      await say(texts[g]); await sleep(450);
    }
    $('backshadow').style.opacity = 0; $('darken').style.opacity = 0; $('hero').style.transform = 'none';
    await enemyIn(); await engageSlam();
  },
  // 3 痕跡: 足跡 → 血痕 → 壊れた看板 が右から流れてくる
  async 3() {
    const ids = ['t1','t2','t3'], texts = ['足跡だ……', 'この跡……新しいな', '……すぐそこにいる'];
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      const e = $(ids[g]);
      e.style.transition = 'none'; e.style.left = '980px'; e.style.opacity = 1; e.style.fontSize = (26 + g * 8) + 'px';
      await sleep(30);
      e.style.transition = `left ${1.4 * S()}s linear`; e.style.left = '-60px';
      $('darken').style.transition='opacity .4s'; $('darken').style.opacity = 0.14 * (g + 1);
      await say(texts[g]); await sleep(450);
    }
    ids.forEach(i => $(i).style.opacity = 0); $('darken').style.opacity = 0;
    await enemyIn(); await engageSlam();
  },
  // 4 旅人が逃走: 左→右に走って通り過ぎ、警告を残す
  async 4() {
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      if (g === 0) {
        const r = $('runner');
        r.style.transition='none'; r.style.left = '-90px'; r.style.opacity = 1;
        await sleep(30);
        r.style.transition = `left ${1.6 * S()}s linear`; r.style.left = '980px';
        await say('逃げろ！ 出たぞ……！', 'traveler'); await sleep(400);
        await say('……ただごとじゃないな');
      }
      if (g === 1) { $('darken').style.transition='opacity .4s'; $('darken').style.opacity = .3; await say('引き返すか……いや'); }
      if (g === 2) { $('darken').style.opacity = .5;
        const s = $('silhouette'); s.style.transition = 'right .5s, opacity .5s'; s.style.opacity = .85; s.style.right = '30px';
        await say('……来るぞ'); shake(); }
      await sleep(450);
    }
    $('runner').style.opacity = 0; $('darken').style.opacity = 0; $('silhouette').style.opacity = 0;
    await enemyIn(); await engageSlam();
  },
  // 5 心音: 画面が脈打ち、周辺が沈む
  async 5() {
    const texts = ['……心臓が鳴る', '……鼓動が速い', '……来るぞ'];
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      $('vignette').style.transition = 'opacity .5s'; $('vignette').style.opacity = 0.3 + 0.25 * g;
      $('darken').style.transition='opacity .5s'; $('darken').style.opacity = 0.12 * (g + 1);
      say(texts[g]);
      const beats = 2 + g, gap = 420 - g * 90;
      for (let i = 0; i < beats; i++) { beat(); await sleep(gap); }
    }
    $('vignette').style.opacity = 0; $('darken').style.opacity = 0;
    await enemyIn(); await engageSlam();
  },
  // 6 収集: 紋章が 1G に 1 枚ずつ点灯、3枚で出現
  async 6() {
    $('emblems').style.transition='opacity .3s'; $('emblems').style.opacity = 1;
    const texts = ['この印は……1つ', '……2つ目だ', '……揃ってしまった'];
    for (let g = 0; g < 3; g++) {
      stageHead(g);
      $('em' + g).classList.add('on');
      $('darken').style.transition='opacity .4s'; $('darken').style.opacity = 0.15 * (g + 1);
      await say(texts[g]);
      if (g === 2) { shake(); await flash($('flash'), '#ffffff', .3, 400); }
      await sleep(450);
    }
    $('darken').style.opacity = 0;
    await enemyIn(); await engageSlam();
    $('emblems').style.opacity = 0;
  },
};

document.querySelectorAll('button[data-k]').forEach(b => b.addEventListener('click', async () => {
  if (busy) return; busy = true;
  document.querySelectorAll('button[data-k]').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
  $('note').innerHTML = notes[b.dataset.k];
  reset(); await sleep(60);
  await plays[b.dataset.k]();
  reset(); busy = false;
}));
</script>
</body>
</html>
